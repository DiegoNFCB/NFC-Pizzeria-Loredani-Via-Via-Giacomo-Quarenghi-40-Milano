<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lascia una recensione</title>

    <!-- CSS rigenerato -->
    <link rel="stylesheet" href="./parteGraficaSito2Prototipo.css">
</head>

<body>

    <main class="card">

        <!-- LOGO circolare con scritta -->
       <div class="logo-container">
            ReviewTap
       </div>


        <!-- STELLE -->
        <div class="stars">
            ★★★★★
        </div>

        <!-- TITOLO -->
        <h1>Grazie per averci scelto!</h1>

        <!-- TESTO -->
        <p>
            La tua opinione è molto importante per noi.<br>
            Ci bastano pochi secondi per sapere cosa ne pensi.
        </p>

        <!-- PULSANTE RECENSIONE -->
        <button id="reviewBtn">
            ⭐ Lascia una recensione
        </button>

        <!-- TESTO PICCOLO -->
        <p class="small">Verrai reindirizzato a Google Reviews</p>

    </main>

    <!-- LOGICA JS -->
    <script src="./parteLogicaSito2.js"></script>

</body>

</html>
